<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Double Take! — Spot the Difference</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23b23a2e'/%3E%3Ccircle cx='16' cy='16' r='9' fill='none' stroke='%23ffd93b' stroke-width='3'/%3E%3Cpath d='M12 16l3 3 6-7' fill='none' stroke='%23ffd93b' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="./styles.css">
</head>
<body>
<div id="app">
  <header id="masthead">
    <div>
      <h1>DOUBLE TAKE!</h1>
      <p class="subtitle">Spot the Difference &middot; 3 hand-drawn scenes &middot; hints, timer &amp; score</p>
    </div>
    <div id="level-picker" role="group" aria-label="Choose a scene">
      <button class="level-btn active" data-scene="0">1 &middot; Harbour</button>
      <button class="level-btn" data-scene="1">2 &middot; Night Market</button>
      <button class="level-btn" data-scene="2">3 &middot; Garden</button>
    </div>
  </header>

  <section id="hud" aria-label="Game status">
    <div class="hud-block">
      <span class="hud-label">Found</span>
      <span id="counter">0 of 7 found</span>
      <span id="dots" aria-hidden="true"></span>
    </div>
    <div class="hud-block">
      <span class="hud-label">Time</span>
      <span id="timer">00:00</span>
    </div>
    <div class="hud-block">
      <span class="hud-label">Score</span>
      <span id="score">0</span>
    </div>
    <div class="hud-block">
      <span class="hud-label">Hints left</span>
      <span id="hints">3</span>
    </div>
    <div class="hud-actions">
      <button id="hint-btn" title="Hint (H) — costs 25 points">💡 Hint <span class="key">H</span></button>
      <button id="restart-btn" title="Restart this scene (R)">↻ Restart <span class="key">R</span></button>
      <button id="sound-btn" title="Sound on/off (M)">🔊 Sound <span class="key">M</span></button>
    </div>
  </section>

  <main id="panels">
    <figure class="panel">
      <figcaption><span class="tag">A</span> Original</figcaption>
      <canvas id="panel-left" width="560" height="400" aria-label="Left picture: the original scene"></canvas>
    </figure>
    <div id="vs" aria-hidden="true">VS</div>
    <figure class="panel">
      <figcaption><span class="tag">B</span> Changed &mdash; find what moved</figcaption>
      <canvas id="panel-right" width="560" height="400" aria-label="Right picture: the same scene with differences"></canvas>
    </figure>
  </main>

  <p id="howto">Click a difference on either picture &mdash; it rings on both. A wrong click costs 15 points.
  <span class="scene-note" id="scene-note">Harbour at Dawn &middot; 7 differences &middot; gentle</span></p>

  <div id="win-overlay" hidden>
    <div id="win-card">
      <h2 id="win-title">Scene complete!</h2>
      <p id="win-stars" aria-label="Stars earned">★★★</p>
      <p id="win-detail"></p>
      <p id="win-total"></p>
      <div id="win-actions">
        <button id="next-btn">Next scene →</button>
        <button id="again-btn">Play again</button>
      </div>
    </div>
  </div>

  <p id="status" role="status" aria-live="polite"></p>
</div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
